server_tokens off;
limit_req_zone $binary_remote_addr zone=genocular_api:10m rate=30r/s;
limit_req_status 429;

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 0;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=genocular_api burst=120 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Preserve the public Host header: it is part of S3 presigned signatures.
  location /raw/ {
    limit_except GET HEAD PUT OPTIONS { deny all; }
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /results/ {
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "sandbox allow-scripts allow-downloads; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "private, no-store" always;
  }

  location /demo-results/ {
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
  }

  location ~ /\. { deny all; }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
